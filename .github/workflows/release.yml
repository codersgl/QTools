name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: 构建并发布 (${{ matrix.platform }} ${{ matrix.args }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ 由 tauri.conf.json 的 version 填充，与 v* 触发规则一致
          tagName: v__VERSION__
          releaseName: QTools v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            ## 安装

            | 平台 | 文件 |
            |---|---|
            | Windows | `qtools_x.y.z_x64-setup.exe`（或 `.msi`） |
            | macOS Apple Silicon | `qtools_x.y.z_aarch64.app.tar.gz` / `.dmg` |
            | macOS Intel | `qtools_x.y.z_x64.app.tar.gz` / `.dmg` |
            | Linux | `.deb` / `.rpm` / `.AppImage` |

            构建未经代码签名：macOS 首次打开需右键 →「打开」绕过 Gatekeeper；
            Windows SmartScreen 会提示「未知发布者」。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
